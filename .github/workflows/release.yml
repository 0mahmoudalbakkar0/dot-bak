name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: build.bat nopause
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/BAK.exe, LICENSE, README.md -DestinationPath dist/BAK-win.zip
          (Get-FileHash dist/BAK.exe -Algorithm SHA256).Hash.ToLower() + "  BAK.exe" | Out-File -Encoding ascii dist/BAK.exe.sha256
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/BAK-win.zip
            dist/BAK.exe
            dist/BAK.exe.sha256
