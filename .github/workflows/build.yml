name: build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: build.bat nopause
      - uses: actions/upload-artifact@v4
        with:
          name: BAK
          path: dist/BAK.exe
